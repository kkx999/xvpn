openapi: 3.0.3
info:
  title: XVPN Panel Android App API
  version: 1.2.0
  description: Invitation-only Android VPN client API. Native App uses Bearer tokens only.
servers:
  - url: https://panel.example.com/api/v1
paths:
  /:
    get:
      summary: Public API configuration
      responses:
        '200':
          description: API status, registration configuration, traffic-report interval and panel timezone
  /health:
    get:
      summary: Health check
      responses:
        '200': {description: Healthy}
  /register:
    post:
      summary: Register with invite code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invite_code, username, password]
              properties:
                invite_code: {type: string}
                username: {type: string, minLength: 3, maxLength: 32}
                password: {type: string, minLength: 8}
      responses:
        '201': {description: Registered}
        '403': {description: Registration closed or invalid invite}
        '409': {description: Username already exists}
        '429': {description: Rate limited}
  /login:
    post:
      summary: Login as App user or administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string}
      responses:
        '200':
          description: Login token
        '401': {description: Invalid credentials}
        '403': {description: Account disabled}
        '429': {description: Rate limited}
  /app/bootstrap:
    get:
      summary: App cold-start bootstrap data
      security: [{bearerAuth: []}]
      responses:
        '200': {description: User and all enabled nodes grouped by country}
        '401': {description: Token invalid or expired}
        '403': {description: Account disabled}
  /me:
    get:
      summary: Current user state
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Current active user}
  /nodes:
    get:
      summary: All enabled nodes grouped and sorted by country
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Node payload}
  /change-password:
    post:
      summary: Change current user or administrator password and rotate tokens
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: {type: string}
                new_password: {type: string, minLength: 8}
      responses:
        '200': {description: Password changed and new token issued}
        '401': {description: Current password invalid}
  /logout:
    post:
      summary: Revoke current token
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Logged out}
  /traffic/report:
    post:
      summary: Report cumulative Android traffic counters
      description: Normal user tokens only. Panel calculates a delta from the previous cumulative counter for the same device/session/node and aggregates user plus node traffic.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id, session_id, node_id, upload_total_bytes, download_total_bytes]
              properties:
                device_id: {type: string, minLength: 8, maxLength: 128}
                session_id: {type: string, minLength: 8, maxLength: 128}
                node_id: {type: integer, minimum: 1, description: Integer id from /nodes or /app/bootstrap}
                upload_total_bytes: {type: integer, format: int64, minimum: 0}
                download_total_bytes: {type: integer, format: int64, minimum: 0}
                app_version: {type: string, maxLength: 64}
      responses:
        '200': {description: Report accepted and aggregated using the configured panel timezone day boundary}
        '400': {description: Invalid counter, identifiers, or stale/unknown node_id}
        '401': {description: Token invalid or expired}
        '403': {description: Account disabled or administrator token}
  /traffic/summary:
    get:
      summary: Current server-side traffic summary for the logged-in user
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Today, month and total upload/download counters plus timezone/day/month keys}
        '401': {description: Token invalid or expired}
        '403': {description: Administrator token is not counted as a user}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
