<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · {{ panel_name }}</title><link rel="stylesheet" href="{{ url_for('admin.static', filename='style.css') }}?v={{ panel_version }}"></head>
<body class="login-body">
<div class="login-wrap">
  <div class="login-brand"><div class="brand-mark large">X</div><h1>{{ panel_name }}</h1><p>{{ panel_subtitle }}</p></div>
  <div class="login-card">
    <h2>欢迎回来</h2><p>登录管理员账户 · 同一 IP 连续失败 10 次将暂停 15 分钟</p>
    {% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}{% for category,msg in messages %}<div class="flash {{ category }}">{{ msg }}</div>{% endfor %}{% endif %}{% endwith %}
    <form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>用户名<input name="username" autocomplete="username" required placeholder="请输入管理员用户名"></label><label>密码<input name="password" type="password" autocomplete="current-password" required placeholder="请输入管理员密码"></label><button class="primary-btn wide" type="submit">立即登录</button></form>
  </div>
</div><script>(()=>{const form=document.querySelector('form');form?.addEventListener('submit',e=>{const btn=e.submitter||form.querySelector('button[type="submit"]');if(form.dataset.submitting==='1'){e.preventDefault();return;}form.dataset.submitting='1';setTimeout(()=>{if(btn){btn.disabled=true;btn.textContent='登录中...';btn.setAttribute('aria-busy','true');}},0);});})();</script></body></html>
