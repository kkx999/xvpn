name: Clear Actions History

on:
  push:
    branches:
      - main

permissions:
  actions: write

jobs:
  clear:
    runs-on: ubuntu-24.04
    steps:
      - name: Remove every Actions record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            --jq ".workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) | .id" |
          while read -r run_id; do
            [ -n "$run_id" ] || continue
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/runs/$run_id"
          done

          export delete_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          (
            unset RUNNER_TRACKING_ID
            for attempt in $(seq 1 30); do
              sleep 1
              status="$(curl -sS -o /dev/null -w '%{http_code}' \
                -X DELETE \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "$delete_url" || true)"
              [ "$status" = "204" ] && exit 0
            done
            exit 0
          ) >/tmp/xvpn-clear-actions.log 2>&1 &
          disown
