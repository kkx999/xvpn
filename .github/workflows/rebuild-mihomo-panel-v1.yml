name: Rebuild Mihomo Panel v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-mihomo-panel-v1.yml'

permissions:
  contents: write
  actions: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preserved panel
        uses: actions/checkout@v4
        with:
          ref: legacy-panel
          fetch-depth: 0

      - name: Build clean Mihomo-native panel tree
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf .github
          rm -f GITHUB_DESCRIPTION.txt GITHUB_PROJECT.md GITHUB_RELEASE_CHECKLIST.md GITHUB_UPDATE.md RELEASE_NOTES.md build-release.sh
          printf '1.0.0\n' > VERSION

          cat > README.md <<'EOF'
          # XVPN Panel v1.0.0

          XVPN Panel 是为 XVPN Android + Mihomo Core 重新整理的控制面板。

          ```text
          Panel 节点导入 -> xvpn.node.v1 -> Android -> Mihomo Profile -> Mihomo Core
          ```

          Panel 不再向 Android 下发 sing-box 配置。节点导入后会在服务端标准化为 `xvpn.node.v1`，Android 只消费标准节点参数并直接生成 Mihomo 配置。

          保留原有产品体验：管理员后台、用户/邀请码、国家分类/排序、流量统计、Android 更新策略、备份、Telegram 和现有后台 UI。

          ## 安装

          ```bash
          bash install.sh
          ```

          管理：

          ```bash
          xvpn
          ```

          修改后台路径并立即重启生效：

          ```bash
          xvpn admin-path manage-xvpn
          ```

          彻底卸载：

          ```bash
          xvpn uninstall
          ```

          卸载会删除 Panel 程序、数据库、配置、备份、systemd 服务、Nginx Panel 站点与运行用户；不会卸载 Nginx/Certbot 软件，也不会主动删除 Let's Encrypt 证书。
          EOF

          cat > APP_API.md <<'EOF'
          # XVPN Android API v1

          Base: `/api/v1`

          - `GET /health`：健康检查
          - `POST /register`：邀请码注册
          - `POST /login`：登录
          - `POST /logout`：退出
          - `GET /me`：当前用户
          - `GET /nodes`：标准节点列表
          - `GET /app/bootstrap`：App 启动数据
          - `POST /traffic/report`：累计流量上报
          - `GET /traffic/summary`：流量摘要
          - `GET /app/update`：Android 更新策略

          ## 节点模型

          `/nodes` 不返回 sing-box 配置字符串。每个节点包含：

          ```json
          {
            "id": 1,
            "name": "香港01",
            "country": "香港",
            "country_code": "HK",
            "protocol": "vless",
            "profile": {
              "schema": "xvpn.node.v1",
              "protocol": "vless",
              "server": "example.com",
              "port": 443,
              "auth": {"uuid": "..."},
              "tls": {"enabled": true, "server_name": "example.com"},
              "transport": {"type": "tcp"},
              "options": {}
            }
          }
          ```

          Android 使用 `profile` 直接生成 Mihomo 配置。
          EOF
          rm -f APP_API_OPENAPI.yaml

          cat > app/node_profile.py <<'PY'
          import base64
          import json
          from urllib.parse import parse_qs, unquote, urlsplit

          SCHEMA = "xvpn.node.v1"
          SUPPORTED = {"vless", "vmess", "trojan", "shadowsocks", "hysteria2", "tuic", "anytls"}
          ALIASES = {"ss": "shadowsocks", "hy2": "hysteria2"}

          def _last(q, *names, default=""):
              for name in names:
                  values = q.get(name.lower())
                  if values:
                      return str(values[-1])
              return default

          def _bool(value, default=False):
              if value is None or value == "": return default
              return str(value).strip().lower() in {"1", "true", "yes", "on"}

          def _port(value):
              try: p = int(value)
              except (TypeError, ValueError): raise ValueError("节点端口无效")
              if p < 1 or p > 65535: raise ValueError("节点端口需为 1-65535")
              return p

          def _decode_b64(value):
              raw = value.strip().split("#", 1)[0]
              raw += "=" * (-len(raw) % 4)
              for decoder in (base64.urlsafe_b64decode, base64.b64decode):
                  try: return decoder(raw.encode()).decode("utf-8")
                  except Exception: pass
              raise ValueError("VMess Base64 数据无效")

          def original_name(raw, fallback="未命名节点"):
              raw = (raw or "").strip()
              if raw.lower().startswith("vmess://"):
                  try:
                      obj = json.loads(_decode_b64(raw.split("://", 1)[1]))
                      name = str(obj.get("ps") or obj.get("remarks") or "").strip()
                      if name: return name
                  except Exception: pass
              if "#" in raw:
                  value = unquote(raw.rsplit("#", 1)[1]).strip()
                  if value: return value
              try:
                  obj = json.loads(raw)
                  if isinstance(obj, dict):
                      name = str(obj.get("name") or "").strip()
                      if name: return name
              except Exception: pass
              return fallback

          def _base(protocol, server, port):
              server = str(server or "").strip().strip("[]")
              if not server: raise ValueError("节点服务器地址不能为空")
              return {
                  "schema": SCHEMA,
                  "protocol": protocol,
                  "server": server,
                  "port": _port(port),
                  "auth": {},
                  "tls": {"enabled": False},
                  "transport": {"type": "tcp"},
                  "options": {},
              }

          def _tls(profile, q, default=False):
              security = _last(q, "security").lower()
              enabled = security in {"tls", "xtls", "reality"} or _bool(_last(q, "tls"), default)
              tls = {"enabled": enabled}
              if not enabled:
                  profile["tls"] = tls
                  return
              sni = _last(q, "sni", "servername", "server_name")
              if sni: tls["server_name"] = sni
              fp = _last(q, "fp", "fingerprint", "client-fingerprint")
              if fp: tls["fingerprint"] = fp
              if _last(q, "allowinsecure", "insecure"):
                  tls["insecure"] = _bool(_last(q, "allowinsecure", "insecure"))
              if security == "reality" or _last(q, "pbk", "publickey"):
                  reality = {"enabled": True}
                  pbk = _last(q, "pbk", "publickey")
                  sid = _last(q, "sid", "shortid")
                  if pbk: reality["public_key"] = pbk
                  if sid: reality["short_id"] = sid
                  tls["reality"] = reality
              profile["tls"] = tls

          def _transport(profile, q):
              kind = _last(q, "type", "network", default="tcp").strip().lower() or "tcp"
              aliases = {"httpupgrade": "httpupgrade", "h2": "h2"}
              kind = aliases.get(kind, kind)
              tr = {"type": kind}
              path = _last(q, "path")
              host = _last(q, "host")
              service = _last(q, "servicename", "service_name")
              if path: tr["path"] = path
              if host: tr["host"] = host
              if service: tr["service_name"] = service
              profile["transport"] = tr

          def _from_vmess(raw):
              payload = raw.split("://", 1)[1]
              obj = json.loads(_decode_b64(payload))
              p = _base("vmess", obj.get("add"), obj.get("port"))
              uuid = str(obj.get("id") or "").strip()
              if not uuid: raise ValueError("VMess UUID 不能为空")
              p["auth"] = {"uuid": uuid, "alter_id": int(obj.get("aid") or 0)}
              if obj.get("scy"): p["options"]["cipher"] = str(obj.get("scy"))
              net = str(obj.get("net") or "tcp").lower()
              p["transport"] = {"type": net}
              if obj.get("path"): p["transport"]["path"] = str(obj.get("path"))
              if obj.get("host"): p["transport"]["host"] = str(obj.get("host"))
              tls = str(obj.get("tls") or "").lower() in {"tls", "1", "true"}
              p["tls"] = {"enabled": tls}
              if tls and obj.get("sni"): p["tls"]["server_name"] = str(obj.get("sni"))
              if tls and obj.get("fp"): p["tls"]["fingerprint"] = str(obj.get("fp"))
              return p

          def canonical_profile(raw):
              raw = (raw or "").strip()
              if not raw: raise ValueError("节点配置不能为空")
              if raw.startswith("{"):
                  try: obj = json.loads(raw)
                  except Exception as exc: raise ValueError("节点 JSON 无效") from exc
                  if obj.get("schema") != SCHEMA: raise ValueError("只接受 xvpn.node.v1 标准 JSON 或支持的节点 URI")
                  protocol = ALIASES.get(str(obj.get("protocol") or "").lower(), str(obj.get("protocol") or "").lower())
                  if protocol not in SUPPORTED: raise ValueError("当前协议暂不支持")
                  obj["protocol"] = protocol
                  obj["server"] = str(obj.get("server") or "").strip()
                  obj["port"] = _port(obj.get("port"))
                  if not obj["server"]: raise ValueError("节点服务器地址不能为空")
                  obj.setdefault("auth", {}); obj.setdefault("tls", {"enabled": False}); obj.setdefault("transport", {"type": "tcp"}); obj.setdefault("options", {})
                  return obj
              scheme = raw.split("://", 1)[0].lower() if "://" in raw else ""
              protocol = ALIASES.get(scheme, scheme)
              if protocol == "vmess": return _from_vmess(raw)
              if protocol not in SUPPORTED: raise ValueError(f"暂不支持此节点协议：{scheme or '未知'}")
              u = urlsplit(raw)
              q = {k.lower(): v for k, v in parse_qs(u.query, keep_blank_values=True).items()}
              p = _base(protocol, u.hostname, u.port)
              username = unquote(u.username or "")
              password = unquote(u.password or "")
              if protocol == "vless":
                  if not username: raise ValueError("VLESS UUID 不能为空")
                  p["auth"] = {"uuid": username}
                  flow = _last(q, "flow")
                  if flow: p["options"]["flow"] = flow
                  _tls(p, q); _transport(p, q)
              elif protocol == "trojan":
                  secret = username or password
                  if not secret: raise ValueError("Trojan 密码不能为空")
                  p["auth"] = {"password": secret}
                  _tls(p, q, True); _transport(p, q)
              elif protocol == "shadowsocks":
                  if not username or password == "": raise ValueError("Shadowsocks 方法或密码不能为空")
                  p["auth"] = {"method": username, "password": password}
              elif protocol == "hysteria2":
                  secret = username or password
                  if not secret: raise ValueError("Hysteria2 密码不能为空")
                  p["auth"] = {"password": secret}
                  p["tls"] = {"enabled": True}
                  sni = _last(q, "sni", "peer")
                  if sni: p["tls"]["server_name"] = sni
                  if _last(q, "insecure"): p["tls"]["insecure"] = _bool(_last(q, "insecure"))
                  obfs = _last(q, "obfs")
                  if obfs:
                      p["options"]["obfs"] = obfs
                      if _last(q, "obfs-password", "obfspassword"): p["options"]["obfs_password"] = _last(q, "obfs-password", "obfspassword")
              elif protocol == "tuic":
                  if not username or not password: raise ValueError("TUIC UUID 和密码不能为空")
                  p["auth"] = {"uuid": username, "password": password}
                  p["tls"] = {"enabled": True}
                  sni = _last(q, "sni")
                  if sni: p["tls"]["server_name"] = sni
                  cc = _last(q, "congestion_control", "congestion-control")
                  if cc: p["options"]["congestion_control"] = cc
                  alpn = _last(q, "alpn")
                  if alpn: p["options"]["alpn"] = [x.strip() for x in alpn.split(",") if x.strip()]
              elif protocol == "anytls":
                  secret = username or password
                  if not secret: raise ValueError("AnyTLS 密码不能为空")
                  p["auth"] = {"password": secret}
                  _tls(p, q, True)
              return p

          def canonical_json(raw):
              return json.dumps(canonical_profile(raw), ensure_ascii=False, separators=(",", ":"))

          def profile_details(profile):
              out = [str(profile.get("protocol") or "").upper()]
              tls = profile.get("tls") or {}
              if tls.get("enabled"):
                  out.append("REALITY" if (tls.get("reality") or {}).get("enabled") else "TLS")
              flow = str((profile.get("options") or {}).get("flow") or "")
              if "vision" in flow.lower(): out.append("Vision")
              kind = str((profile.get("transport") or {}).get("type") or "")
              if kind and kind != "tcp": out.append(kind.upper() if len(kind) <= 4 else kind)
              return list(dict.fromkeys(x for x in out if x))
          PY

          cat > app/db.py <<'PY'
          import sqlite3
          from contextlib import contextmanager
          from datetime import datetime, timezone
          from flask import current_app
          from werkzeug.security import generate_password_hash

          SCHEMA = r'''
          PRAGMA journal_mode=WAL;
          PRAGMA foreign_keys=ON;
          CREATE TABLE admins(id INTEGER PRIMARY KEY AUTOINCREMENT,username TEXT NOT NULL UNIQUE COLLATE NOCASE,password_hash TEXT NOT NULL,created_at TEXT NOT NULL,updated_at TEXT,session_version INTEGER NOT NULL DEFAULT 1);
          CREATE TABLE invites(id INTEGER PRIMARY KEY AUTOINCREMENT,code TEXT NOT NULL UNIQUE COLLATE NOCASE,status TEXT NOT NULL DEFAULT 'active' CHECK(status IN ('active','used','revoked')),max_uses INTEGER NOT NULL DEFAULT 1 CHECK(max_uses>=1),use_count INTEGER NOT NULL DEFAULT 0 CHECK(use_count>=0),used_by INTEGER,created_at TEXT NOT NULL,used_at TEXT);
          CREATE TABLE users(id INTEGER PRIMARY KEY AUTOINCREMENT,username TEXT NOT NULL UNIQUE COLLATE NOCASE,password_hash TEXT NOT NULL,status TEXT NOT NULL DEFAULT 'active' CHECK(status IN ('active','disabled')),invite_id INTEGER,created_at TEXT NOT NULL,last_login_at TEXT,password_changed_at TEXT,FOREIGN KEY(invite_id) REFERENCES invites(id) ON DELETE SET NULL);
          CREATE TABLE nodes(id INTEGER PRIMARY KEY AUTOINCREMENT,name TEXT NOT NULL,original_name TEXT NOT NULL DEFAULT '',country TEXT NOT NULL,country_code TEXT NOT NULL,region TEXT NOT NULL DEFAULT '',protocol TEXT NOT NULL,source_enc TEXT NOT NULL,profile_enc TEXT NOT NULL,sort_order INTEGER NOT NULL DEFAULT 100,status TEXT NOT NULL DEFAULT 'enabled' CHECK(status IN ('enabled','disabled')),created_at TEXT NOT NULL,updated_at TEXT NOT NULL);
          CREATE TABLE country_orders(country_code TEXT PRIMARY KEY,sort_order INTEGER NOT NULL DEFAULT 100,updated_at TEXT NOT NULL);
          CREATE TABLE api_tokens(id INTEGER PRIMARY KEY AUTOINCREMENT,user_id INTEGER NOT NULL,token_hash TEXT NOT NULL UNIQUE,expires_at TEXT NOT NULL,created_at TEXT NOT NULL,last_used_at TEXT,FOREIGN KEY(user_id) REFERENCES users(id) ON DELETE CASCADE);
          CREATE TABLE admin_api_tokens(id INTEGER PRIMARY KEY AUTOINCREMENT,admin_id INTEGER NOT NULL,token_hash TEXT NOT NULL UNIQUE,expires_at TEXT NOT NULL,created_at TEXT NOT NULL,last_used_at TEXT,FOREIGN KEY(admin_id) REFERENCES admins(id) ON DELETE CASCADE);
          CREATE TABLE traffic_device_counters(user_id INTEGER NOT NULL,device_id TEXT NOT NULL,session_id TEXT NOT NULL,node_id INTEGER NOT NULL DEFAULT 0,upload_total_bytes INTEGER NOT NULL DEFAULT 0 CHECK(upload_total_bytes>=0),download_total_bytes INTEGER NOT NULL DEFAULT 0 CHECK(download_total_bytes>=0),app_version TEXT NOT NULL DEFAULT '',last_report_at TEXT NOT NULL,PRIMARY KEY(user_id,device_id),FOREIGN KEY(user_id) REFERENCES users(id) ON DELETE CASCADE);
          CREATE TABLE traffic_daily(user_id INTEGER NOT NULL,day TEXT NOT NULL,upload_bytes INTEGER NOT NULL DEFAULT 0 CHECK(upload_bytes>=0),download_bytes INTEGER NOT NULL DEFAULT 0 CHECK(download_bytes>=0),report_count INTEGER NOT NULL DEFAULT 0 CHECK(report_count>=0),updated_at TEXT NOT NULL,PRIMARY KEY(user_id,day),FOREIGN KEY(user_id) REFERENCES users(id) ON DELETE CASCADE);
          CREATE TABLE traffic_node_daily(user_id INTEGER NOT NULL,node_id INTEGER NOT NULL,day TEXT NOT NULL,node_name TEXT NOT NULL DEFAULT '',country TEXT NOT NULL DEFAULT '',region TEXT NOT NULL DEFAULT '',upload_bytes INTEGER NOT NULL DEFAULT 0 CHECK(upload_bytes>=0),download_bytes INTEGER NOT NULL DEFAULT 0 CHECK(download_bytes>=0),report_count INTEGER NOT NULL DEFAULT 0 CHECK(report_count>=0),updated_at TEXT NOT NULL,PRIMARY KEY(user_id,node_id,day),FOREIGN KEY(user_id) REFERENCES users(id) ON DELETE CASCADE);
          CREATE TABLE system_event_logs(id INTEGER PRIMARY KEY AUTOINCREMENT,category TEXT NOT NULL,level TEXT NOT NULL DEFAULT 'info',message TEXT NOT NULL,created_at TEXT NOT NULL);
          CREATE TABLE system_settings(key TEXT PRIMARY KEY,value TEXT NOT NULL,updated_at TEXT NOT NULL);
          CREATE TABLE auth_rate_limits(rate_key TEXT PRIMARY KEY,attempts INTEGER NOT NULL DEFAULT 0,window_started_at TEXT NOT NULL,blocked_until TEXT);
          CREATE INDEX idx_nodes_status_sort ON nodes(status,country_code,sort_order,id);
          CREATE INDEX idx_country_orders_sort ON country_orders(sort_order,country_code);
          CREATE INDEX idx_tokens_user ON api_tokens(user_id);
          CREATE INDEX idx_traffic_daily_day ON traffic_daily(day,user_id);
          CREATE INDEX idx_traffic_counters_report ON traffic_device_counters(last_report_at);
          CREATE INDEX idx_traffic_node_daily_day ON traffic_node_daily(day,node_id,user_id);
          CREATE INDEX idx_system_event_logs_created ON system_event_logs(created_at,id);
          '''

          def utcnow(): return datetime.now(timezone.utc).isoformat(timespec="seconds")

          def connect(app=None):
              app = app or current_app
              conn = sqlite3.connect(app.config["DATABASE_PATH"], timeout=10)
              conn.row_factory = sqlite3.Row
              conn.execute("PRAGMA foreign_keys=ON")
              return conn

          @contextmanager
          def transaction(app=None):
              conn = connect(app)
              try:
                  conn.execute("BEGIN IMMEDIATE")
                  yield conn
                  conn.commit()
              except Exception:
                  conn.rollback(); raise
              finally: conn.close()

          def init_db(app):
              with connect(app) as conn:
                  conn.executescript(SCHEMA)
                  conn.commit()

          def bootstrap_admin(app):
              import os
              password = os.environ.get("ADMIN_PASSWORD", "").strip()
              with connect(app) as conn:
                  if conn.execute("SELECT 1 FROM admins LIMIT 1").fetchone(): return
                  if not password or password == "change-me-now": raise RuntimeError("ADMIN_PASSWORD is required for first-run bootstrap")
                  now = utcnow()
                  conn.execute("INSERT INTO admins(username,password_hash,created_at,updated_at) VALUES(?,?,?,?)",("admin",generate_password_hash(password,method="scrypt"),now,now))
                  conn.commit()
          PY

          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/settings_store.py')
          s=p.read_text()
          s=s.replace('"registration_enabled": "1",', '"registration_enabled": "1",\n    "admin_path": "admin",', 1)
          s=s.replace('app.config["REGISTRATION_ENABLED"] = values.get("registration_enabled", "1") == "1"', 'app.config["REGISTRATION_ENABLED"] = values.get("registration_enabled", "1") == "1"\n    app.config["ADMIN_PATH"] = (values.get("admin_path") or "admin").strip().strip("/")')
          p.write_text(s)
          PY

          cat > app/__init__.py <<'PY'
          import os
          import re
          from pathlib import Path
          from flask import Flask
          from werkzeug.middleware.proxy_fix import ProxyFix
          from .db import init_db, bootstrap_admin
          from .crypto import ensure_crypto_ready
          from .admin import admin_bp
          from .api import api_bp
          from .settings_store import initialize_from_env, apply_settings

          def _safe_admin_path(value):
              value = str(value or "admin").strip().strip("/")
              if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_-]{2,47}", value): return "admin"
              if value.lower() in {"api", "static", "assets", "health"}: return "admin"
              return value

          def create_app():
              app = Flask(__name__)
              app.secret_key = os.environ.get("SECRET_KEY", "dev-only-change-me")
              app.json.ensure_ascii = False
              app.config["PANEL_NAME"] = os.environ.get("PANEL_NAME", "XVPN Panel")
              app.config["PANEL_SUBTITLE"] = os.environ.get("PANEL_SUBTITLE", "私人访问控制台")
              app.config["TOKEN_DAYS"] = int(os.environ.get("TOKEN_DAYS", "30"))
              app.config["SESSION_COOKIE_HTTPONLY"] = True
              app.config["SESSION_COOKIE_SAMESITE"] = "Lax"
              app.config["SESSION_COOKIE_SECURE"] = os.environ.get("COOKIE_SECURE", "0") == "1"
              app.config["DATABASE_PATH"] = os.environ.get("DATABASE_PATH", "./data/panel.db")
              app.config["FERNET_KEY"] = os.environ.get("FERNET_KEY", "")
              app.config["ANDROID_UPDATE_REPOSITORY"] = os.environ.get("XVPN_ANDROID_REPOSITORY", "kkx999/XVPN-Android").strip() or "kkx999/XVPN-Android"
              app.config["ADMIN_ALLOWED_IPS"] = {x.strip() for x in os.environ.get("ADMIN_ALLOWED_IPS", "").split(",") if x.strip()}
              if os.environ.get("TRUST_PROXY") == "1": app.wsgi_app = ProxyFix(app.wsgi_app, x_for=1, x_proto=1, x_host=1)
              Path(app.config["DATABASE_PATH"]).parent.mkdir(parents=True, exist_ok=True)
              ensure_crypto_ready(app)
              init_db(app)
              initialize_from_env(app)
              apply_settings(app)
              bootstrap_admin(app)
              admin_path = _safe_admin_path(app.config.get("ADMIN_PATH"))
              app.config["ADMIN_PATH"] = admin_path
              app.register_blueprint(admin_bp, url_prefix=f"/{admin_path}")
              app.register_blueprint(api_bp, url_prefix="/api/v1")
              @app.get("/")
              def root(): return {"service": app.config["PANEL_NAME"], "status": "ok", "core": "mihomo", "node_schema": "xvpn.node.v1"}
              return app
          PY

          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/admin.py')
          s=p.read_text().replace('config_enc','source_enc')
          s=s.replace('from .crypto import decrypt_text, encrypt_text', 'from .crypto import decrypt_text, encrypt_text\nfrom .node_profile import canonical_profile, canonical_json, profile_details')
          # Display canonical traits, never infer them from legacy core JSON.
          old='''    try:\n        raw = decrypt_text(current_app, row["source_enc"])\n        item["protocol_details"] = detect_protocol_details(raw)\n    except Exception:\n        item["protocol_details"] = [str(row["protocol"] or "custom").upper()]'''
          new='''    try:\n        profile = json.loads(decrypt_text(current_app, row["profile_enc"]))\n        item["protocol_details"] = profile_details(profile)\n    except Exception:\n        item["protocol_details"] = [str(row["protocol"] or "unknown").upper()]'''
          if old not in s: raise SystemExit('node view patch anchor missing')
          s=s.replace(old,new,1)
          # Single node: validate and normalize once before storage.
          anchor='''    protocol = detect_protocol(raw)\n    now = utcnow()'''
          repl='''    try:\n        profile = canonical_profile(raw)\n    except ValueError as exc:\n        flash(str(exc), "error")\n        return redirect(url_for("admin.nodes"))\n    protocol = profile["protocol"]\n    now = utcnow()'''
          if anchor not in s: raise SystemExit('single node anchor missing')
          s=s.replace(anchor,repl,1)
          s=s.replace('INSERT INTO nodes(name,original_name,country,country_code,region,protocol,source_enc,sort_order,status,created_at,updated_at)\n               VALUES(?,?,?,?,?,?,?,?,?,?,?)', 'INSERT INTO nodes(name,original_name,country,country_code,region,protocol,source_enc,profile_enc,sort_order,status,created_at,updated_at)\n               VALUES(?,?,?,?,?,?,?,?,?,?,?,?)',1)
          s=s.replace('''                encrypt_text(current_app, raw),\n                _to_int(request.form.get("sort_order"), 100),''','''                encrypt_text(current_app, raw),\n                encrypt_text(current_app, json.dumps(profile, ensure_ascii=False, separators=(",", ":"))),\n                _to_int(request.form.get("sort_order"), 100),''',1)
          # Batch preview validates every line before showing confirmation.
          marker='''    preview = []\n    for idx, raw in enumerate(lines):\n        original_name = detect_original_name(raw, f"节点 {idx + 1:02d}")'''
          replacement='''    preview = []\n    for idx, raw in enumerate(lines):\n        try:\n            profile = canonical_profile(raw)\n        except ValueError as exc:\n            flash(f"第 {idx + 1} 条节点无效：{exc}", "error")\n            return redirect(url_for("admin.nodes"))\n        original_name = detect_original_name(raw, f"节点 {idx + 1:02d}")'''
          if marker not in s: raise SystemExit('batch preview anchor missing')
          s=s.replace(marker,replacement,1)
          s=s.replace('''                "protocol": detect_protocol(raw),\n                "protocol_details": detect_protocol_details(raw),''','''                "protocol": profile["protocol"],\n                "protocol_details": profile_details(profile),''',1)
          # Validate posted confirmation data again, before the transaction starts.
          marker='''    now = utcnow()\n    with transaction() as conn:\n        _ensure_country_order(conn, code)\n        for idx, raw in enumerate(configs):'''
          replacement='''    try:\n        profiles = [canonical_profile(raw.strip()) for raw in configs]\n    except ValueError as exc:\n        flash(f"批量节点数据无效：{exc}", "error")\n        return redirect(url_for("admin.nodes"))\n    now = utcnow()\n    with transaction() as conn:\n        _ensure_country_order(conn, code)\n        for idx, raw in enumerate(configs):'''
          if marker not in s: raise SystemExit('batch confirm anchor missing')
          s=s.replace(marker,replacement,1)
          # second INSERT occurrence
          s=s.replace('INSERT INTO nodes(name,original_name,country,country_code,region,protocol,source_enc,sort_order,status,created_at,updated_at)\n                   VALUES(?,?,?,?,?,?,?,?,?,?,?)', 'INSERT INTO nodes(name,original_name,country,country_code,region,protocol,source_enc,profile_enc,sort_order,status,created_at,updated_at)\n                   VALUES(?,?,?,?,?,?,?,?,?,?,?,?)',1)
          s=s.replace('''                    detect_protocol(raw),\n                    encrypt_text(current_app, raw),\n                    sort_order,''','''                    profiles[idx]["protocol"],\n                    encrypt_text(current_app, raw),\n                    encrypt_text(current_app, json.dumps(profiles[idx], ensure_ascii=False, separators=(",", ":"))),\n                    sort_order,''',1)
          # Edit: normalize before update, store source + canonical profile atomically.
          marker='''    code, country = _country_from_form()\n    with connect() as conn:\n        current = conn.execute("SELECT original_name FROM nodes WHERE id=?", (node_id,)).fetchone()'''
          replacement='''    code, country = _country_from_form()\n    try:\n        profile = canonical_profile(raw)\n    except ValueError as exc:\n        flash(str(exc), "error")\n        return redirect(url_for("admin.node_edit_page", node_id=node_id))\n    with connect() as conn:\n        current = conn.execute("SELECT original_name FROM nodes WHERE id=?", (node_id,)).fetchone()'''
          if marker not in s: raise SystemExit('edit anchor missing')
          s=s.replace(marker,replacement,1)
          s=s.replace('UPDATE nodes SET name=?,original_name=?,country=?,country_code=?,protocol=?,source_enc=?,sort_order=?,updated_at=? WHERE id=?', 'UPDATE nodes SET name=?,original_name=?,country=?,country_code=?,protocol=?,source_enc=?,profile_enc=?,sort_order=?,updated_at=? WHERE id=?',1)
          s=s.replace('''                detect_protocol(raw),\n                encrypt_text(current_app, raw),\n                _to_int(request.form.get("sort_order"), 100),''','''                profile["protocol"],\n                encrypt_text(current_app, raw),\n                encrypt_text(current_app, json.dumps(profile, ensure_ascii=False, separators=(",", ":"))),\n                _to_int(request.form.get("sort_order"), 100),''',1)
          # Custom admin path setting. Takes effect after restart because Flask route table is constructed at process start.
          marker='''    values = {\n        "panel_name": panel_name,'''
          replacement='''    admin_path = request.form.get("admin_path", "admin").strip().strip("/")\n    if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_-]{2,47}", admin_path) or admin_path.lower() in {"api", "static", "assets", "health"}:\n        flash("后台路径需为 3-48 位字母、数字、- 或 _，且不能使用系统保留路径", "error")\n        return redirect(url_for("admin.settings"))\n    old_admin_path = (get_settings().get("admin_path") or "admin").strip().strip("/")\n    values = {\n        "panel_name": panel_name,\n        "admin_path": admin_path,'''
          if marker not in s: raise SystemExit('settings anchor missing')
          s=s.replace(marker,replacement,1)
          s=s.replace('flash("系统设置已保存并立即生效", "success")', 'flash((f"系统设置已保存；后台路径已改为 /{admin_path}，执行 xvpn restart 后生效，旧路径将直接 404" if admin_path != old_admin_path else "系统设置已保存并立即生效"), "success")',1)
          p.write_text(s)
          PY

          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/api.py')
          s=p.read_text()
          pattern=r'def _nodes_payload\(\):.*?\n\n\n@api_bp\.get\("/app/bootstrap"\)'
          replacement='''def _nodes_payload():\n    with connect() as conn:\n        rows = conn.execute(\n            """SELECT n.*, COALESCE(co.sort_order,999999) country_sort_order\n               FROM nodes n LEFT JOIN country_orders co ON co.country_code=n.country_code\n               WHERE n.status='enabled' ORDER BY country_sort_order,n.country_code,n.sort_order,n.id"""\n        ).fetchall()\n    countries = {}\n    total = 0\n    for row in rows:\n        try:\n            profile = json.loads(decrypt_text(current_app, row["profile_enc"]))\n            if profile.get("schema") != "xvpn.node.v1":\n                continue\n        except Exception:\n            continue\n        key = row["country_code"]\n        countries.setdefault(key,{\n            "country": row["country"], "country_code": key,\n            "flag_emoji": "".join(chr(127397+ord(ch)) for ch in key) if len(key)==2 and key.isalpha() and key!="ZZ" else "🌐",\n            "sort_order": row["country_sort_order"], "nodes": []})\n        countries[key]["nodes"].append({\n            "id": row["id"], "name": row["name"], "display_name": row["name"],\n            "country": row["country"], "country_code": row["country_code"], "region": row["region"],\n            "protocol": profile.get("protocol", row["protocol"]), "profile": profile, "sort_order": row["sort_order"]})\n        total += 1\n    return {"ok": True, "schema": "xvpn.nodes.v1", "node_schema": "xvpn.node.v1", "core": "mihomo", "countries": list(countries.values()), "total": total}\n\n\n@api_bp.get("/app/bootstrap")'''
          s,n=re.subn(pattern,replacement,s,flags=re.S)
          if n!=1: raise SystemExit(f'nodes payload patch failed: {n}')
          s=s.replace('"app_api_ready": True,', '"app_api_ready": True,\n        "core": "mihomo",\n        "node_schema": "xvpn.node.v1",',1)
          p.write_text(s)
          PY

          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/templates/settings.html')
          s=p.read_text()
          s=s.replace('<div><h2>基础设置</h2><p>修改后立即生效，不需要 SSH 编辑配置。</p></div>', '<div><h2>基础设置</h2><p>常规参数立即生效；后台路径修改后需重启 Panel。</p></div>',1)
          anchor='''      <label>副标题\n        <input name="panel_subtitle" maxlength="80" value="{{ settings_values.panel_subtitle }}" placeholder="私人访问控制台">\n      </label>'''
          insert=anchor+'''\n      <label>后台路径\n        <input name="admin_path" minlength="3" maxlength="48" value="{{ settings_values.admin_path }}" required placeholder="manage-xvpn">\n        <small class="help-text">保存后执行 <code>xvpn restart</code> 生效；新路径生效后旧后台路径直接返回 404。</small>\n      </label>'''
          if anchor not in s: raise SystemExit('settings template anchor missing')
          s=s.replace(anchor,insert,1)
          p.write_text(s)
          PY

          cat > xvpn <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          APP_DIR="/opt/xvpn-panel"; DATA_DIR="/var/lib/xvpn-panel"; ENV_FILE="/etc/xvpn-panel.env"; BACKUP_DIR="/var/backups/xvpn-panel"
          SERVICE_FILE="/etc/systemd/system/xvpn-panel.service"; NGINX_SITE="/etc/nginx/sites-available/xvpn-panel"
          need_root(){ [[ ${EUID} -eq 0 ]] || { echo "[ERROR] 请使用 root 运行 xvpn。" >&2; exit 1; }; }
          current_version(){ [[ -f "$APP_DIR/VERSION" ]] && tr -d '[:space:]' < "$APP_DIR/VERSION" || echo unknown; }
          current_domain(){ [[ -f "$NGINX_SITE" ]] && awk '/^[[:space:]]*server_name[[:space:]]+/ {gsub(/;/,"",$2);if($2!="_"){print $2;exit}}' "$NGINX_SITE" 2>/dev/null || true; }
          db_path(){ awk -F= '/^DATABASE_PATH=/{print substr($0,index($0,"=")+1);exit}' "$ENV_FILE" 2>/dev/null || true; }
          admin_path(){
            local db; db="$(db_path)"; [[ -n "$db" && -f "$db" ]] || { echo admin; return; }
            sqlite3 "$db" "SELECT value FROM system_settings WHERE key='admin_path' LIMIT 1;" 2>/dev/null | head -n1 | sed 's#^/*##;s#/*$##' | grep . || echo admin
          }
          restart_panel(){ need_root; systemctl restart xvpn-panel; sleep 1; systemctl is-active --quiet xvpn-panel && echo "[OK] XVPN Panel 已重启。" || { journalctl -u xvpn-panel -n 60 --no-pager; return 1; }; }
          set_admin_path(){
            need_root; local value="${1:-}" db domain
            value="${value#/}"; value="${value%/}"
            [[ "$value" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{2,47}$ ]] || { echo "[ERROR] 后台路径需为 3-48 位字母、数字、- 或 _。" >&2; return 2; }
            case "${value,,}" in api|static|assets|health) echo "[ERROR] 该路径为系统保留路径。" >&2; return 2;; esac
            db="$(db_path)"; [[ -n "$db" && -f "$db" ]] || { echo "[ERROR] 找不到 Panel 数据库。" >&2; return 1; }
            sqlite3 "$db" "INSERT INTO system_settings(key,value,updated_at) VALUES('admin_path','$value',datetime('now')) ON CONFLICT(key) DO UPDATE SET value=excluded.value,updated_at=excluded.updated_at;"
            chown xvpn-panel:xvpn-panel "$db" 2>/dev/null || true
            restart_panel
            domain="$(current_domain)"
            [[ -n "$domain" ]] && echo "[OK] 新后台：https://$domain/$value/login" || echo "[OK] 新后台路径：/$value/login"
            echo "旧后台路径已失效。"
          }
          uninstall_panel(){
            need_root; local yes="${1:-}"
            if [[ "$yes" != "--yes" ]]; then
              echo "⚠️  即将彻底删除 XVPN Panel：程序、数据库、用户、节点、配置、备份和 Nginx Panel 站点。"
              echo "不会卸载 Nginx/Certbot，也不会主动删除 Let's Encrypt 证书。"
              read -r -p "输入 YES 继续：" confirm
              [[ "$confirm" == "YES" ]] || { echo "已取消。"; return 0; }
            fi
            systemctl stop xvpn-panel xvpn-panel-backup.timer xvpn-panel-backup.service 2>/dev/null || true
            systemctl disable xvpn-panel xvpn-panel-backup.timer xvpn-panel-backup.service 2>/dev/null || true
            rm -f /etc/systemd/system/xvpn-panel.service /etc/systemd/system/xvpn-panel-backup.service /etc/systemd/system/xvpn-panel-backup.timer
            rm -f /etc/nginx/sites-enabled/xvpn-panel /etc/nginx/sites-available/xvpn-panel
            rm -rf "$APP_DIR" "$DATA_DIR" "$BACKUP_DIR"
            rm -f "$ENV_FILE" /etc/xvpn-panel-update.conf /usr/local/bin/xvpn
            id xvpn-panel >/dev/null 2>&1 && userdel xvpn-panel || true
            systemctl daemon-reload; systemctl reset-failed || true
            nginx -t && systemctl reload nginx || true
            echo "[OK] XVPN Panel 已彻底卸载，26818 端口应已释放。"
          }
          show_status(){ need_root; systemctl status xvpn-panel --no-pager || true; }
          show_logs(){ need_root; journalctl -u xvpn-panel -n 80 -f; }
          reset_password(){ need_root; (cd "$APP_DIR" && "$APP_DIR/.venv/bin/python" reset-admin-password.py); }
          manage_domain(){ need_root; "$APP_DIR/domain-manager.sh"; }
          menu(){
            need_root
            while true; do
              clear || true; echo "XVPN Panel v$(current_version)"; echo "后台路径：/$(admin_path)"; echo
              echo "1) 域名 / HTTPS 管理"; echo "2) 查看服务状态"; echo "3) 重启 Panel"; echo "4) 查看实时日志"; echo "5) 重置管理员密码"; echo "6) 修改后台路径"; echo "7) 卸载并彻底清除"; echo "0) 退出"
              read -r -p "请选择 [0-7]: " c
              case "$c" in
                1) manage_domain;; 2) show_status;; 3) restart_panel;; 4) show_logs;; 5) reset_password;;
                6) read -r -p "新的后台路径（例如 manage-xvpn）：" p; set_admin_path "$p";;
                7) uninstall_panel; return;; 0) return;; *) echo "输入无效";; esac
              [[ "$c" != 4 ]] && { echo; read -r -p "按 Enter 继续..." _ || true; }
            done
          }
          case "${1:-}" in
            "") menu;; status) show_status;; restart) restart_panel;; logs|log) show_logs;; password|passwd) reset_password;; domain|https) manage_domain;;
            admin-path) [[ -n "${2:-}" ]] && set_admin_path "$2" || { echo "当前后台路径：/$(admin_path)"; echo "修改：xvpn admin-path manage-xvpn"; };;
            uninstall) uninstall_panel "${2:-}";; version) current_version;;
            help|-h|--help) cat <<'HELP'
          XVPN Panel 命令：
            xvpn                       打开管理菜单
            xvpn status                查看服务状态
            xvpn restart               重启 Panel
            xvpn logs                  查看实时日志
            xvpn password              重置管理员密码
            xvpn domain                域名 / HTTPS 管理
            xvpn admin-path NAME       修改后台路径并重启生效
            xvpn uninstall             彻底卸载并清除 Panel
            xvpn version               显示当前版本
          HELP
            ;;
            *) echo "未知命令：$1" >&2; exit 2;;
          esac
          SH
          chmod +x xvpn

          # Old installer remains as the battle-tested deployment layer, but remove all legacy vpn-panel migration paths.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('install.sh')
          s=p.read_text()
          start=s.find('# One-time migration from legacy pre-XVPN internal names.')
          end=s.find('if [[ -f "$ENV_FILE" && -f "$DATA_DIR/panel.db" ]]; then', start)
          if start!=-1 and end!=-1: s=s[:start]+s[end:]
          # Fresh v1 uses a fresh database schema; upgrades of this new line can still preserve /var/lib/xvpn-panel.
          s=s.replace('XVPN Panel v$INSTALL_VERSION', 'XVPN Panel Mihomo v$INSTALL_VERSION')
          p.write_text(s)
          PY

          mkdir -p tests
          cat > tests/test_node_profile.py <<'PY'
          import unittest
          from app.node_profile import canonical_profile
          class NodeProfileTest(unittest.TestCase):
              def test_vless_reality(self):
                  p=canonical_profile('vless://11111111-1111-1111-1111-111111111111@example.com:443?security=reality&sni=www.example.com&fp=chrome&pbk=abc&sid=01&type=tcp#HK')
                  self.assertEqual(p['protocol'],'vless'); self.assertTrue(p['tls']['reality']['enabled'])
              def test_trojan(self):
                  p=canonical_profile('trojan://secret@example.com:443?sni=example.com&type=ws&path=%2Fws#JP')
                  self.assertEqual(p['transport']['type'],'ws'); self.assertEqual(p['auth']['password'],'secret')
              def test_hy2(self):
                  p=canonical_profile('hysteria2://pass@example.com:443?sni=example.com#SG')
                  self.assertEqual(p['protocol'],'hysteria2')
              def test_tuic(self):
                  p=canonical_profile('tuic://11111111-1111-1111-1111-111111111111:pass@example.com:443?sni=example.com#US')
                  self.assertEqual(p['auth']['password'],'pass')
              def test_reject_unknown(self):
                  with self.assertRaises(ValueError): canonical_profile('socks://a:b@example.com:1080')
          if __name__=='__main__': unittest.main()
          PY

          cat > .gitignore <<'EOF'
          __pycache__/
          *.pyc
          .venv/
          data/
          *.db
          *.sqlite*
          .DS_Store
          EOF

      - name: Compile and smoke-test v1
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m compileall -q app run.py reset-admin-password.py backup-worker.py
          python3 -m unittest -v tests.test_node_profile
          python3 -m venv /tmp/xvpn-ci-venv
          /tmp/xvpn-ci-venv/bin/pip -q install --upgrade pip
          /tmp/xvpn-ci-venv/bin/pip -q install -r requirements.txt
          export SECRET_KEY='ci-secret'
          export FERNET_KEY=$(/tmp/xvpn-ci-venv/bin/python -c 'from cryptography.fernet import Fernet;print(Fernet.generate_key().decode())')
          export DATABASE_PATH=/tmp/xvpn-panel-ci.db
          export ADMIN_PASSWORD='TestPass1234'
          export COOKIE_SECURE=0
          /tmp/xvpn-ci-venv/bin/python - <<'PY'
          import os, json
          from app import create_app
          from app.crypto import encrypt_text
          from app.db import connect, utcnow
          from app.node_profile import canonical_profile
          app=create_app(); app.testing=True
          with app.app_context():
              p=canonical_profile('vless://11111111-1111-1111-1111-111111111111@example.com:443?security=tls&sni=example.com#香港01')
              with connect() as db:
                  now=utcnow()
                  db.execute("INSERT INTO nodes(name,original_name,country,country_code,region,protocol,source_enc,profile_enc,sort_order,status,created_at,updated_at) VALUES(?,?,?,?,?,?,?,?,?,?,?,?)",('香港01','香港01','香港','HK','',p['protocol'],encrypt_text(app,'source'),encrypt_text(app,json.dumps(p,ensure_ascii=False)),100,'enabled',now,now)); db.commit()
          c=app.test_client()
          assert c.get('/').status_code==200
          assert c.get('/api/v1/health').status_code==200
          assert c.get('/admin/login').status_code==200
          assert c.get('/api/v1/nodes').status_code==401
          rules=[str(r) for r in app.url_map.iter_rules()]
          assert '/admin/login' in rules and '/api/v1/login' in rules
          print('smoke ok:', len(rules), 'routes')
          PY
          rm -f /tmp/xvpn-panel-ci.db /tmp/xvpn-panel-ci.db-shm /tmp/xvpn-panel-ci.db-wal
          bash -n install.sh xvpn domain-manager.sh install-online.sh
          grep -RniE 'sing-box|libbox|vpn-panel' app README.md APP_API.md xvpn || true

      - name: Remove old releases tags and previous action runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set +e
          for id in $(gh api "repos/$REPO/releases?per_page=100" --paginate --jq '.[].id'); do gh api -X DELETE "repos/$REPO/releases/$id"; done
          git fetch --tags --force
          for tag in $(git tag -l); do git push origin --delete "$tag" || true; done
          for id in $(gh api "repos/$REPO/actions/runs?per_page=100" --paginate --jq '.workflow_runs[].id'); do
            [[ "$id" == "$GITHUB_RUN_ID" ]] && continue
            gh api -X DELETE "repos/$REPO/actions/runs/$id" || true
          done
          exit 0

      - name: Publish clean root commit to main
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan xvpn-mihomo-v1
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git add -A
          git commit -m 'XVPN Panel v1.0.0: clean Mihomo-native foundation'
          git push origin HEAD:main --force
